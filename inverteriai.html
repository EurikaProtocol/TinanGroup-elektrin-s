<body>
<a class="skip" href="#main">Pereiti prie turinio</a>
<header id="site-header"></header>
<main id="main" class="container section">
<h1>Inverteriai</h1>
<p>Kiekvieno modelio galimybės skiriasi, todėl visada tikrinkite konkretų modelį. Šiame kataloge pateikiami tik modeliai, kurių duomenis galime nurodyti; kiti laukai žymimi „Nepatvirtinta“.</p>
<p id="spec-notice" class="notice"></p>
<p id="price-notice" class="notice warn"></p>
<form id="filters" class="filters card">
  <label>Gamintojas<select id="f-manufacturer"><option value="">Visi</option></select></label>
  <label>Galia<select id="f-power"><option value="">Visos</option></select></label>
  <label>Fazės<select id="f-phase"><option value="">Visos</option><option value="1">Vienfazis</option><option value="3">Trifazis</option></select></label>
  <label>Segmentas<select id="f-segment"><option value="">Visi</option><option value="residential">Namams</option><option value="commercial">Komerciniai (30 kW+)</option></select></label>
  <label>Tipas<select id="f-type"><option value="">Visi</option><option value="hybrid">Hibridinis</option><option value="grid">Tinklo</option></select></label>
  <label>Baterijos<select id="f-battery"><option value="">Nesvarbu</option><option value="yes">Suderinamas</option><option value="no">Nepritaikytas</option></select></label>
  <label>Baterijos įtampa<select id="f-voltage"><option value="">Bet kokia</option><option value="LV">Žema (LV)</option><option value="HV">Aukšta (HV)</option></select></label>
  <label>Maks. kaina su PVM (€)<input id="f-price" type="number" min="0" placeholder="pvz., 2000"></label>
  <button class="btn btn-outline" type="reset">Išvalyti</button>
</form>
<p id="result-count" aria-live="polite"></p>
<div id="compare-bar" class="notice" hidden><span id="compare-text"></span> <button type="button" class="btn btn-primary" id="compare-open">Palyginti</button> <button type="button" class="btn btn-outline" id="compare-clear">Išvalyti</button></div>
<div id="inverter-list" class="inverter-grid"></div>
</main>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-title"><button type="button" class="btn btn-outline dialog-close" id="dialog-close">Uždaryti</button><div id="dialog-body"></div></dialog>
